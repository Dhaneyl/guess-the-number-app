
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Adivina el número 🎯</title>

  <!-- Nuestro archivo de estilos -->
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="game">

    <div class="emoji">🎯</div>

    <h1>Adivina el número</h1>

    <p>
      Estoy pensando en un número del 1 al 10.
      ¿Puedes adivinarlo?
    </p>

    <div class="secret">?</div>

    <label for="guess">Tu número:</label>

    <input
      type="number"
      id="guess"
      min="1"
      max="10"
      placeholder="Escribe un número"
    >

    <button id="guessButton">
      ¡Adivinar!
    </button>

    <p id="message">¡Intenta adivinar!</p>

  </main>

  <!-- Nuestro archivo de JavaScript -->
  <script src="script.js"></script>

</body>
</html>
